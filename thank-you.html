<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - CAS Studio</title>
    <meta name="description" content="Thank you for contacting CAS Studio. We'll be in touch soon.">

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header class="header scrolled">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="images/LOGO_CAS_STUDIO_branco-01.png" alt="CAS Studio" class="logo-white">
                <img src="images/LOGO_CAS_STUDIO_reto-01.png" alt="CAS Studio" class="logo-dark">
            </a>
            <a href="index.html" class="btn btn-primary">
                <span class="arrow-icon">←</span>
                BACK TO HOME
            </a>
        </div>
    </header>

    <!-- Thank You Section -->
    <section class="thank-you-section">
        <div class="container">
            <div class="thank-you-content">
                <div class="thank-you-icon">✓</div>
                <h1 class="thank-you-title">Thanks</h1>
                <p class="thank-you-message">You'll receive an email with the available time slots for your free 15-minute consultation, along with our Portfolio PDF</p>
                <a href="index.html" class="btn btn-primary btn-large">
                    <span class="arrow-icon">←</span>
                    BACK TO HOME
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text"><strong>CAS Studio - Sustainable Crafted Architecture</strong></p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
